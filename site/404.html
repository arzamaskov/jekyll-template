---
layout: default
title: 404
permalink: /404.html
---
{%- assign page_lang = page.lang | default: site.lang | default: "ru" -%}
{%- assign ui = site.data.ui[page_lang] -%}

<section class="not-found">
  <h1 class="page__title">{{ ui.not_found.title }}</h1>
  <p class="page__lead">{{ ui.not_found.message }}</p>
  <p><a href="{{ '/' | relative_url }}">{{ ui.not_found.home }}</a></p>
</section>
