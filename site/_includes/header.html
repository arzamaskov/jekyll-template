{%- assign page_lang = page.lang | default: site.lang | default: "ru" -%}
{%- assign ui = site.data.ui[page_lang] -%}
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <div class="site-header__actions">
      <nav class="site-nav" aria-label="Primary">
        <a
          class="site-nav__link{% if page.url == '/' or page.url contains '/page/' %} is-active{% endif %}"
          href="{{ '/' | relative_url }}"
        >{{ ui.nav.home }}</a>
        <a
          class="site-nav__link{% if page.url contains '/categories' %} is-active{% endif %}"
          href="{{ '/categories/' | relative_url }}"
        >{{ ui.nav.categories }}</a>
        <a
          class="site-nav__link{% if page.url contains '/tags' %} is-active{% endif %}"
          href="{{ '/tags/' | relative_url }}"
        >{{ ui.nav.tags }}</a>
      </nav>
      <div class="site-search">
        <button
          type="button"
          class="site-search-toggle"
          data-search-toggle
          aria-label="{{ ui.search.label }}"
          aria-expanded="false"
          aria-controls="site-search-panel"
        >
          <svg class="site-search-toggle__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.75"/>
            <path d="M16.5 16.5L21 21" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"/>
          </svg>
        </button>

        <div
          id="site-search-panel"
          class="site-search-panel"
          data-search-panel
          hidden
        >
          <form class="search" role="search" data-search-form>
            <label class="visually-hidden" for="site-search">{{ ui.search.label }}</label>
            <input
              id="site-search"
              class="search__input"
              type="search"
              name="q"
              placeholder="{{ ui.search.placeholder }}"
              autocomplete="off"
              data-search-input
            >
            <button type="button" class="search__clear" data-search-clear hidden>{{ ui.search.clear }}</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</header>
