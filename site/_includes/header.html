{%- assign page_lang = page.lang | default: site.lang | default: "ru" -%}
{%- assign ui = site.data.ui[page_lang] -%}
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-logo" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav class="site-nav" aria-label="Primary">
      <a
        class="site-nav__link{% if page.url == '/' or page.url contains '/page/' %} is-active{% endif %}"
        href="{{ '/' | relative_url }}"
      >{{ ui.nav.home }}</a>
      <a
        class="site-nav__link{% if page.url contains '/categories' %} is-active{% endif %}"
        href="{{ '/categories/' | relative_url }}"
      >{{ ui.nav.categories }}</a>
      <a
        class="site-nav__link{% if page.url contains '/tags' %} is-active{% endif %}"
        href="{{ '/tags/' | relative_url }}"
      >{{ ui.nav.tags }}</a>
    </nav>
  </div>
</header>
